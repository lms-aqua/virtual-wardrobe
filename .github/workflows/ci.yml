name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint (ruff, non-blocking)
        run: ruff check . || echo "::warning::ruff reported issues (non-blocking)"
      - name: Test (pytest)
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          WARDROBE_ENV: development
        run: pytest -q
