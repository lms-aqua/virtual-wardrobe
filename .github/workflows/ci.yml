name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so feedback is fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          WARDROBE_ENV: development
        run: pytest -q

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  containers:
    name: Containers (build + compose validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The api and worker services declare `env_file: ../.env`, which Compose
      # resolves independently of --env-file, so the file has to exist on disk.
      # Seeding it from the committed .env.example is deliberate: it proves the
      # stack starts from documented configuration alone and never depends on
      # an uncommitted local .env.
      - name: Seed .env from the committed example
        run: cp .env.example .env

      - name: Validate Compose config
        run: |
          docker compose -f infrastructure/docker-compose.yml config --quiet
          echo "compose config valid"

      # The worker shares the api build context, so building the api image
      # covers both services.
      - name: Build API/worker image
        run: docker build -t vw-api:ci apps/api

      - name: Build web image
        run: docker build -t vw-web:ci apps/web

      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^vw-'
