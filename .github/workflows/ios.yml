name: iOS build (unsigned IPA)

# Compiles the SwiftUI app on GitHub's macOS runners, publishes an UNSIGNED
# .ipa to the moving "ios-latest" release, and regenerates the AltStore source
# manifest with a bumped version each build so AltStore shows an update.
# Download/sign/install with AppDB, AltStore, Sideloadly, ESign, or TrollStore.

on:
  workflow_dispatch:
    inputs:
      republish:
        description: "Overwrite the already-published release for this version"
        type: boolean
        default: false
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26      # Xcode 26.x — iOS 26 SDK, Swift 6.2 (Liquid Glass)
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK + Swift 6.2)
        run: |
          set -eo pipefail
          # Pin to the newest Xcode 26.x rather than the newest Xcode overall:
          # the runner image also gains prerelease majors (27 preview), and a
          # beta toolchain must never be picked up silently by a release build.
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No Xcode 26.x found on this runner:"; ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          swift --version
          echo "iOS SDKs:"; xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build version from the AltStore manifest
        run: |
          set -eo pipefail
          # Single source of truth: apps/ios/altstore-source.json. The .ipa's
          # CFBundleShortVersionString MUST match the manifest version, or
          # AltStore will loop / mis-detect updates.
          VERSION=$(python3 -c "import json;print(json.load(open('altstore-source.json'))['apps'][0]['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info-generated.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info-generated.plist
          echo "Building version $VERSION (build ${{ github.run_number }})"

      - name: Build (device SDK, no signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -project VirtualWardrobe.xcodeproj \
            -scheme VirtualWardrobe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -eo pipefail
          APP_DIR="build/Build/Products/Release-iphoneos/VirtualWardrobe.app"
          test -d "$APP_DIR" || { echo "App not found at $APP_DIR"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP_DIR" Payload/
          zip -qry VirtualWardrobe-unsigned.ipa Payload
          echo "IPA_SIZE=$(stat -f%z VirtualWardrobe-unsigned.ipa)" >> "$GITHUB_ENV"

      - name: Inject real .ipa size into the manifest
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json, os

          version = os.environ["VERSION"]
          size = int(os.environ["IPA_SIZE"])

          with open("altstore-source.json", encoding="utf-8") as f:
              m = json.load(f)
          app = m["apps"][0]

          # Only this release's entry gets the new size. The previous version of
          # this step stamped it onto EVERY entry, which silently rewrote the
          # recorded size of every historical release in the published manifest.
          app["size"] = size
          matches = [v for v in app.get("versions", []) if v.get("version") == version]
          if len(matches) != 1:
              raise SystemExit(
                  f"manifest must contain exactly one entry for {version}, found {len(matches)}"
              )
          matches[0]["size"] = size

          with open("altstore-source.json", "w", encoding="utf-8") as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"size {size} applied to app + version {version} only; "
                f"{len(app.get('versions', [])) - 1} historical entries untouched")
          PY

      - name: Decide whether this build may publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH: ${{ github.event.inputs.republish }}
        run: |
          set -eo pipefail
          # A permanent release is immutable once it exists: rebuilding without
          # bumping the version used to overwrite it in place, which is how
          # v1.4.0 ended up holding a later build's .ipa.
          if gh release view "v$VERSION" >/dev/null 2>&1 && [ "$REPUBLISH" != "true" ]; then
            echo "PUBLISH=false" >> "$GITHUB_ENV"
            echo "::warning title=Release not published::v$VERSION is already published and was left untouched. Bump the version in apps/ios/altstore-source.json, or re-run this workflow with republish=true to overwrite it deliberately."
          else
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Commit the corrected manifest back to main
        # The main README points AltStore at the raw main copy, so that file —
        # not just the release asset — has to carry the real size. Skipped when
        # this build is not publishing: recording the size of a binary that
        # never reached the release would make the manifest describe an artifact
        # nobody can download. The skip-ci marker keeps this push from
        # retriggering the workflow (the manifest sits under apps/ios/**).
        if: env.PUBLISH == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -eo pipefail
          if git diff --quiet -- altstore-source.json; then
            echo "manifest unchanged; nothing to commit"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json
          git commit -m "iOS $VERSION: record real .ipa size in AltStore manifest [skip ci]"
          git push origin HEAD:main
          echo "manifest committed to main"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualWardrobe-unsigned-ipa
          path: apps/ios/VirtualWardrobe-unsigned.ipa
          if-no-files-found: error

      - name: Publish releases (permanent per-version + moving latest)
        # Gated by the decision step above. The build artifact is still attached
        # to the run either way, so a rebuild is never wasted — it just cannot
        # mutate published history.
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          NOTES="Virtual Wardrobe $VERSION — unsigned .ipa for sideloading (AppDB / AltStore / Sideloadly / ESign / TrollStore). See the README for install steps."
          ASSETS="VirtualWardrobe-unsigned.ipa altstore-source.json icon.png"

          # 1) Permanent, never-deleted release for THIS version.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "republish=true — deliberately overwriting v$VERSION"
            gh release upload "v$VERSION" $ASSETS --clobber
          else
            gh release create "v$VERSION" $ASSETS --title "Virtual Wardrobe $VERSION" --notes "$NOTES"
          fi

          # 2) Moving "ios-latest" pointer. Updated IN PLACE — it used to be
          #    deleted and recreated every build, which destroyed and reissued
          #    every asset URL under it. AltStore reads the icon and manifest
          #    from here, so that churn made a stable source look like it kept
          #    changing. Clobbering the assets keeps the tag and URLs fixed.
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest $ASSETS --clobber
            gh release edit ios-latest --title "Latest ($VERSION)" \
              --notes "$NOTES Permanent copy: v$VERSION."
          else
            gh release create ios-latest $ASSETS --title "Latest ($VERSION)" \
              --notes "$NOTES Permanent copy: v$VERSION."
          fi
          echo "Released v$VERSION (kept) + ios-latest (updated in place)."
