name: iOS build (unsigned IPA)

# Compiles the SwiftUI app on GitHub's macOS runners, publishes an UNSIGNED
# .ipa to the moving "ios-latest" release, and regenerates the AltStore source
# manifest with a bumped version each build so AltStore shows an update.
# Download/sign/install with AppDB, AltStore, Sideloadly, ESign, or TrollStore.

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15      # Xcode 16 (reads XcodeGen project format 77)
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          set -eo pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          DEV="${LATEST:-/Applications/Xcode.app}/Contents/Developer"
          sudo xcode-select -s "$DEV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build version from the AltStore manifest
        run: |
          set -eo pipefail
          # Single source of truth: apps/ios/altstore-source.json. The .ipa's
          # CFBundleShortVersionString MUST match the manifest version, or
          # AltStore will loop / mis-detect updates.
          VERSION=$(python3 -c "import json;print(json.load(open('altstore-source.json'))['apps'][0]['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info-generated.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info-generated.plist
          echo "Building version $VERSION (build ${{ github.run_number }})"

      - name: Build (device SDK, no signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -project VirtualWardrobe.xcodeproj \
            -scheme VirtualWardrobe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -eo pipefail
          APP_DIR="build/Build/Products/Release-iphoneos/VirtualWardrobe.app"
          test -d "$APP_DIR" || { echo "App not found at $APP_DIR"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP_DIR" Payload/
          zip -qry VirtualWardrobe-unsigned.ipa Payload
          echo "IPA_SIZE=$(stat -f%z VirtualWardrobe-unsigned.ipa)" >> "$GITHUB_ENV"

      - name: Inject real .ipa size into the manifest copy
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json, os
          m = json.load(open("altstore-source.json"))
          size = int(os.environ["IPA_SIZE"])
          app = m["apps"][0]
          app["size"] = size
          for v in app.get("versions", []):
              v["size"] = size
          json.dump(m, open("altstore-source.json", "w"), indent=2)
          print("manifest size set to", size)
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualWardrobe-unsigned-ipa
          path: apps/ios/VirtualWardrobe-unsigned.ipa
          if-no-files-found: error

      - name: Publish to "ios-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest \
            VirtualWardrobe-unsigned.ipa altstore-source.json icon.png \
            --title "iOS $VERSION (unsigned)" \
            --notes "Version $VERSION. Unsigned .ipa for sideloading (AppDB / AltStore / Sideloadly / ESign / TrollStore). AltStore source: $GITHUB_SERVER_URL/${{ github.repository }}/releases/download/ios-latest/altstore-source.json"
          echo "AltStore source URL: $GITHUB_SERVER_URL/${{ github.repository }}/releases/download/ios-latest/altstore-source.json"
