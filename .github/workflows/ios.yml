name: iOS build (unsigned IPA)

# Compiles the SwiftUI app on GitHub's macOS runners and uploads an UNSIGNED
# .ipa artifact. Download it and sign/install with AppDB (or any sideload tool),
# which handles signing without a paid Apple Developer account.
#
# Run it from the Actions tab (workflow_dispatch), or it runs on pushes that
# touch the iOS app.

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write        # needed to publish the .ipa as a Release asset

jobs:
  build:
    # macos-15 ships Xcode 16, which can read the project format (objectVersion
    # 77) that current XcodeGen emits. macos-14 (Xcode 15) cannot.
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          set -eo pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          DEV="${LATEST:-/Applications/Xcode.app}/Contents/Developer"
          echo "Selecting $DEV"
          sudo xcode-select -s "$DEV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (device SDK, no signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -project VirtualWardrobe.xcodeproj \
            -scheme VirtualWardrobe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -eo pipefail
          APP_DIR="build/Build/Products/Release-iphoneos/VirtualWardrobe.app"
          test -d "$APP_DIR" || { echo "App not found at $APP_DIR"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP_DIR" Payload/
          zip -qry VirtualWardrobe-unsigned.ipa Payload
          ls -lh VirtualWardrobe-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualWardrobe-unsigned-ipa
          path: apps/ios/VirtualWardrobe-unsigned.ipa
          if-no-files-found: error

      # Publish the .ipa to a moving "ios-latest" release so there is a stable
      # download URL for AppDB / AltStore / Sideloadly / ESign / TrollStore.
      - name: Publish to "ios-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest \
            VirtualWardrobe-unsigned.ipa \
            --title "iOS unsigned build (latest)" \
            --notes "Unsigned .ipa for sideloading. Sign + install with AppDB, AltStore, Sideloadly, ESign, or TrollStore. See apps/ios/README.md. Built from ${{ github.sha }}."
          echo "Download: https://github.com/${{ github.repository }}/releases/download/ios-latest/VirtualWardrobe-unsigned.ipa"
