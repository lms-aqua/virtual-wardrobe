[project]
name = "wardrobe-core"
version = "3.0.0"
description = "Virtual Wardrobe API + worker core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9",  # sync driver used by Alembic migrations
    "alembic>=1.13.2",
    "redis>=5.0.8",
    "dramatiq[redis]>=1.17.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "pyjwt[crypto]>=2.9.0",
    "email-validator>=2.2.0",
    "trimesh>=4.0",
    "numpy>=1.26",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.5",
    "mypy>=1.11.2",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
include = ["wardrobe_core*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Bandit (S) rules produce mostly false positives here (bind-all, asserts,
# stdlib random, SQL string literals) — omitted so lint can be enforced in CI.
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's `Depends()/Header()/Query()` in argument defaults is the
# intended pattern. UP042/UP047: `str, Enum` mixins and TypeVar generics are
# deliberate (JSON-compat enums, broad SQLAlchemy support).
ignore = ["B008", "UP042", "UP047"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
